name: Seoi Kidsnote static site

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "최근 N개만 정적 export 테스트. 전체 배포면 비워두세요."
        required: false
        default: ""
      deploy:
        description: "Cloudflare Pages 배포까지 실행할지 선택"
        required: true
        default: "on"
        type: choice
        options: ["on", "off"]
  workflow_run:
    workflows: ["Kidsnote → Notion mirror"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: seoi-kidsnote-static
  cancel-in-progress: false

jobs:
  export-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 은 미러가 **시작할 때**의 커밋을 가리킨다. 미러가
          # 30~40분 도는 사이에 푸시한 UI 변경은 그래서 그날 배포에서 조용히
          # 빠지고, 다음 날에야 나타난다. 자동 배포는 기본 브랜치의 최신
          # 코드를 쓴다 — 정적 사이트는 항상 지금 코드로 다시 만드는 게 맞다.
          # 수동 실행(workflow_dispatch)은 고른 ref 를 그대로 둔다.
          ref: >-
            ${{ github.event_name == 'workflow_run'
                && github.event.repository.default_branch
                || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Export Notion data to static files
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          PYTHONUNBUFFERED: "1"
          EXPORT_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '' }}
        run: |
          set -eu
          ARGS=()
          if [ -n "${EXPORT_LIMIT}" ]; then
            ARGS+=( "--limit" "${EXPORT_LIMIT}" )
          fi
          python static-export/export_static_site.py "${ARGS[@]}"

      # limit 을 준 export 는 글 몇 개짜리 dist/ 를 만든다. 그대로 배포하면
      # 라이브 사이트가 그 몇 개로 줄어든다. deploy 기본값이 on 이라
      # "테스트로 limit 만 넣고 돌렸다"가 바로 이 사고가 된다.
      - name: Refuse to deploy a limited export
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.limit != '' && inputs.deploy == 'on' }}
        run: |
          echo "::error::limit 을 준 export 는 배포할 수 없습니다. deploy 를 off 로 두고 다시 실행하세요."
          exit 1

      - name: Check Cloudflare Pages limits
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("static-export/dist/export-report.json").read_text())
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if not report.get("pages_file_limit_ok"):
              raise SystemExit("Cloudflare Pages file count limit exceeded")
          if not report.get("pages_file_size_limit_ok"):
              raise SystemExit("Cloudflare Pages single file size limit exceeded")
          if report.get("missing_media_count", 0):
              raise SystemExit("Some Notion media files were not downloaded")
          PY

      # Runs from static-export/, not the repo root. Wrangler resolves both
      # `functions/` and `wrangler.jsonc` relative to the working directory,
      # never relative to the asset directory it is handed. Deploying
      # `static-export/dist` from the root uploads the static files and
      # silently drops the Functions and the D1 binding with them — the site
      # looks fine and every /api/* request falls through to index.html.
      - name: Deploy to Cloudflare Pages
        if: ${{ github.event_name == 'workflow_run' || inputs.deploy == 'on' }}
        working-directory: static-export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '88b28a9c6734bd6185852a2804db5469' }}
        run: |
          set -eu
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing GitHub secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing Cloudflare Account ID"
            exit 1
          fi
          # Fail loudly rather than shipping an API-less site: losing these
          # two files breaks comments, likes and the video list without
          # breaking the build.
          for required in functions wrangler.jsonc; do
            if [ ! -e "${required}" ]; then
              echo "::error::${required} missing from static-export/ — Functions would not be deployed"
              exit 1
            fi
          done
          npx --yes wrangler pages deploy dist \
            --project-name seoi-kidsnote \
            --branch main \
            --commit-dirty=true
