# Keep KIDSNOTE_SESSION_COOKIE alive.
#
# Kidsnote's sessionid is valid for 30 days from the login that minted it and
# does not slide when the mirror uses it, so it dies on a predictable monthly
# cadence. Before this workflow existed every mirror run after that point
# failed until someone logged in by hand, copied the cookie out of Chrome and
# pasted it into the repo secret.
#
# This runs daily but only *probes* the cookie; it logs in and rewrites the
# secret on the one day a month the probe fails. Kidsnote tracks concurrent
# sessions (`already_login`) and can flag an account as `blocked`, so logging
# in every day would be both wasteful and risky.
#
# Required repository secrets:
#   KIDSNOTE_USERNAME    Kidsnote login id
#   KIDSNOTE_PASSWORD    Kidsnote password
#   GH_SECRETS_PAT       PAT with repo scope. The built-in GITHUB_TOKEN cannot
#                        manage Actions secrets no matter what `permissions:`
#                        says, so rewriting KIDSNOTE_SESSION_COOKIE needs one.

name: Kidsnote session refresh

on:
  workflow_dispatch:
    inputs:
      force:
        description: "쿠키가 살아 있어도 강제로 로그인해 갱신 (로그인 경로 검증용). 평소엔 off."
        required: false
        default: "off"
        type: choice
        options: ["off", "on"]
  schedule:
    # 02:40 KST daily - 35 minutes ahead of the 03:15 KST mirror, so a cookie
    # that died overnight is replaced before the first mirror of the day.
    - cron: "40 17 * * *"

permissions:
  contents: read

concurrency:
  group: kidsnote-session-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Probe cookie, refresh only if dead
        id: refresh
        env:
          KIDSNOTE_SESSION_COOKIE: ${{ secrets.KIDSNOTE_SESSION_COOKIE }}
          KIDSNOTE_USERNAME: ${{ secrets.KIDSNOTE_USERNAME }}
          KIDSNOTE_PASSWORD: ${{ secrets.KIDSNOTE_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -eu
          ARGS=( "--session-out" "${RUNNER_TEMP}/kidsnote-session" )
          if [ "${{ inputs.force }}" = "on" ]; then
            ARGS+=( "--force" )
          fi
          python tools/kidsnote_fetch/refresh_session.py "${ARGS[@]}"

      # Piped through stdin rather than --body so the cookie never lands in a
      # command line or the process table.
      #
      # The token is trimmed before use: a stray newline from `echo` or a
      # textarea rides along into the Authorization header and GitHub answers
      # 401 Bad credentials, which reads identically to a revoked token.
      - name: Store refreshed cookie
        if: ${{ steps.refresh.outputs.refreshed == 'true' }}
        env:
          RAW_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          set -eu
          if [ -z "${RAW_TOKEN:-}" ]; then
            echo "::error::Cookie was refreshed but GH_SECRETS_PAT is unset, so it cannot be saved."
            exit 1
          fi

          GH_TOKEN="$(printf %s "${RAW_TOKEN}" | tr -d '[:space:]')"
          export GH_TOKEN

          # Shape only - never the value. Enough to tell a truncated paste or a
          # fine-grained token from a classic one without leaking anything.
          raw_len=${#RAW_TOKEN}
          trimmed_len=${#GH_TOKEN}
          echo "token: length ${trimmed_len} (raw ${raw_len}), prefix ${GH_TOKEN%%_*}_"
          if [ "${raw_len}" -ne "${trimmed_len}" ]; then
            echo "::warning::GH_SECRETS_PAT contained whitespace; trimmed before use."
          fi

          if ! who="$(gh api user -q .login 2>&1)"; then
            echo "::error::GH_SECRETS_PAT does not authenticate: ${who}"
            exit 1
          fi
          echo "authenticated as ${who}"

          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/secrets/public-key" \
                 -q .key_id > /dev/null 2>&1; then
            echo "::error::Token authenticates but cannot read this repo's secrets. A classic token needs the 'repo' scope; a fine-grained one needs Secrets: Read and write plus access to this repository."
            exit 1
          fi

          gh secret set KIDSNOTE_SESSION_COOKIE \
            --repo "${GITHUB_REPOSITORY}" \
            < "${RUNNER_TEMP}/kidsnote-session"
          echo "KIDSNOTE_SESSION_COOKIE updated."

      - name: Clean up
        if: always()
        run: rm -f "${RUNNER_TEMP}/kidsnote-session"
